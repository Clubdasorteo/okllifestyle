<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Club da Sorte</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #151515;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #d4af37;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #222;
            color: #fff;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #d4af37;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn-sair {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #444;
            color: #fff;
            margin-bottom: 25px;
        }

        #painel {
            display: none;
        }

        #mensagem,
        #loginMensagem {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container" id="login">

    <h1>Acesso administrativo</h1>

    <div class="form-group">
        <label>E-mail</label>
        <input type="email" id="email">
    </div>

    <div class="form-group">
        <label>Senha</label>
        <input type="password" id="senha">
    </div>

    <button type="button" class="btn" id="btnLogin">
        Entrar
    </button>

    <div id="loginMensagem"></div>

</div>


<div class="container" id="painel">

    <h1>Painel Administrativo</h1>

    <button type="button" class="btn-sair" id="btnSair">
        Sair
    </button>

    <p><strong>Criar nova ação</strong></p>

    <form id="formAcao">

        <div class="form-group">
            <label>Nome da ação</label>
            <input type="text" id="nome" required>
        </div>

        <div class="form-group">
            <label>Prêmio</label>
            <input type="text" id="premio" required>
        </div>

        <div class="form-group">
            <label>Descrição do prêmio</label>
            <textarea id="premio_descricao"></textarea>
        </div>

        <div class="form-group">
            <label>Descrição da ação</label>
            <textarea id="descricao"></textarea>
        </div>

        <div class="form-group">
            <label>URL da foto do prêmio</label>
            <input type="text" id="foto_url">
        </div>

        <div class="form-group">
            <label>Valor de cada número</label>
            <input type="number" id="valor_numero" step="0.01" min="0" required>
        </div>

        <div class="form-group">
            <label>Total de números</label>
            <input type="number" id="total_numeros" min="1" required>
        </div>

        <div class="form-group">
            <label>Quantidade</label>
            <input type="number" id="quantidade" min="1" required>
        </div>

        <div class="form-group">
            <label>Data e hora do sorteio</label>
            <input type="datetime-local" id="data_sorteio">
        </div>

        <div class="form-group">
            <label>Link de pagamento</label>
            <input type="text" id="link_pagamento">
        </div>

        <div class="form-group">
            <label>Observações</label>
            <textarea id="observacoes"></textarea>
        </div>

        <button type="submit" class="btn">
            Criar ação
        </button>

    </form>

    <div id="mensagem"></div>

</div>


<script>

const URL_SUPABASE =
    "https://vlirpvuramslfiftshio.supabase.co";

const CHAVE_SUPABASE =
    "sb_publishable_xsvg1O6hHgmpbv1D_10PRw_xOysBwuj";

const clienteSupabase =
    window.supabase.createClient(
        URL_SUPABASE,
        CHAVE_SUPABASE
    );


async function verificarSessao() {

    const resultado =
        await clienteSupabase.auth.getSession();

    const sessao = resultado.data.session;

    if (sessao) {

        document.getElementById("login").style.display = "none";
        document.getElementById("painel").style.display = "block";

    } else {

        document.getElementById("login").style.display = "block";
        document.getElementById("painel").style.display = "none";

    }
}


document
    .getElementById("btnLogin")
    .addEventListener("click", async function () {

        const email =
            document.getElementById("email").value.trim();

        const senha =
            document.getElementById("senha").value;

        const mensagem =
            document.getElementById("loginMensagem");

        mensagem.textContent = "Entrando...";

        const resultado =
            await clienteSupabase.auth.signInWithPassword({
                email: email,
                password: senha
            });

        if (resultado.error) {

            console.error(resultado.error);

            mensagem.textContent =
                "Erro: " + resultado.error.message;

            return;
        }

        mensagem.textContent = "";

        await verificarSessao();
    });


document
    .getElementById("btnSair")
    .addEventListener("click", async function () {

        await clienteSupabase.auth.signOut();

        await verificarSessao();
    });


document
    .getElementById("formAcao")
    .addEventListener("submit", async function (event) {

        event.preventDefault();

        const mensagem =
            document.getElementById("mensagem");

        mensagem.textContent = "Criando ação...";

        const resultado =
            await clienteSupabase
                .from("acoes")
                .insert([{

                    nome:
                        document.getElementById("nome").value,

                    premio:
                        document.getElementById("premio").value,

                    premio_descricao:
                        document.getElementById("premio_descricao").value,

                    descricao:
                        document.getElementById("descricao").value,

                    foto_url:
                        document.getElementById("foto_url").value,

                    valor_numero:
                        Number(
                            document.getElementById("valor_numero").value
                        ),

                    total_numeros:
                        Number(
                            document.getElementById("total_numeros").value
                        ),

                    quantidade:
                        Number(
                            document.getElementById("quantidade").value
                        ),

                    data_sorteio:
                        document.getElementById("data_sorteio").value || null,

                    link_pagamento:
                        document.getElementById("link_pagamento").value,

                    observacoes:
                        document.getElementById("observacoes").value

                }]);


        if (resultado.error) {

            console.error(resultado.error);

            mensagem.textContent =
                "Erro ao criar ação: " +
                resultado.error.message;

            return;
        }

        mensagem.textContent =
            "Ação criada com sucesso!";

        document.getElementById("formAcao").reset();

    });


verificarSessao();

</script>

</body>
</html>
