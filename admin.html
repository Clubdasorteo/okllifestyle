<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f5f5f5;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            padding: 12px 20px;
            border: 0;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-criar {
            background: #111;
            color: white;
        }

        #mensagem {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Painel Administrativo</h1>

    <p>Criar nova ação</p>

    <form id="formAcao">

        <div class="form-group">
            <label>Nome da ação</label>
            <input type="text" id="nome" required>
        </div>

        <div class="form-group">
            <label>Prêmio</label>
            <input type="text" id="premio" required>
        </div>

        <div class="form-group">
            <label>Descrição do prêmio</label>
            <textarea id="premio_descricao"></textarea>
        </div>

        <div class="form-group">
            <label>Descrição da ação</label>
            <textarea id="descricao"></textarea>
        </div>

        <div class="form-group">
            <label>URL da foto do prêmio</label>
            <input type="text" id="foto_url">
        </div>

        <div class="form-group">
            <label>Valor de cada número</label>
            <input type="number" id="valor_numero" step="0.01" required>
        </div>

        <div class="form-group">
            <label>Total de números</label>
            <input type="number" id="total_numeros" required>
        </div>

        <div class="form-group">
            <label>Quantidade</label>
            <input type="number" id="quantidade" required>
        </div>

        <div class="form-group">
            <label>Data e hora do sorteio</label>
            <input type="datetime-local" id="data_sorteio">
        </div>

        <div class="form-group">
            <label>Link de pagamento</label>
            <input type="text" id="link_pagamento">
        </div>

        <div class="form-group">
            <label>Observações</label>
            <textarea id="observacoes"></textarea>
        </div>

        <button type="submit" class="btn-criar">
            Criar ação
        </button>

    </form>

    <div id="mensagem"></div>

</div>

<script>

const SUPABASE_URL =
    "https://vlirpvuramslfiftshio.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_xsvg1O6hHgmpbv1D_10PRw_xOysBwuj";

const supabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );


document.getElementById("formAcao").addEventListener("submit", async function(event) {

    event.preventDefault();

    const mensagem = document.getElementById("mensagem");

    mensagem.textContent = "Criando ação...";

    const { data, error } = await supabase
        .from("acoes")
        .insert([
            {
                nome: document.getElementById("nome").value,
                premio: document.getElementById("premio").value,
                premio_descricao: document.getElementById("premio_descricao").value,
                descricao: document.getElementById("descricao").value,
                foto_url: document.getElementById("foto_url").value,
                valor_numero: Number(document.getElementById("valor_numero").value),
                total_numeros: Number(document.getElementById("total_numeros").value),
                quantidade: Number(document.getElementById("quantidade").value),
                data_sorteio: document.getElementById("data_sorteio").value || null,
                link_pagamento: document.getElementById("link_pagamento").value,
                observacoes: document.getElementById("observacoes").value
            }
        ])
        .select();

    if (error) {
        console.error(error);
        mensagem.textContent = "Erro ao criar ação: " + error.message;
        return;
    }

    mensagem.textContent = "Ação criada com sucesso!";

    document.getElementById("formAcao").reset();

});

</script>

</body>
</html>
