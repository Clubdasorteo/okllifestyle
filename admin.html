<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo - Club da Sorte</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #151515;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #d4af37;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #222;
            color: #fff;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #d4af37;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn-sair {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #444;
            color: #fff;
            margin-bottom: 25px;
        }

        #painel {
            display: none;
        }

        #mensagem,
        #loginMensagem {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container" id="login">

    <h1>Acesso administrativo</h1>

    <div class="form-group">
        <label>E-mail</label>

        <input
            type="email"
            id="email"
        >
    </div>

    <div class="form-group">
        <label>Senha</label>

        <input
            type="password"
            id="senha"
        >
    </div>

    <button
        type="button"
        class="btn"
        id="btnLogin"
    >
        Entrar
    </button>

    <div id="loginMensagem"></div>

</div>


<div class="container" id="painel">

    <h1>Painel Administrativo</h1>

    <button
        type="button"
        class="btn-sair"
        id="btnSair"
    >
        Sair
    </button>

    <p>
        <strong>Criar nova ação</strong>
    </p>

    <form id="formAcao">

        <div class="form-group">
            <label>Nome da ação</label>

            <input
                type="text"
                id="nome"
                required
            >
        </div>


        <div class="form-group">
            <label>Prêmio</label>

            <input
                type="text"
                id="premio"
                required
            >
        </div>


        <div class="form-group">
            <label>Descrição do prêmio</label>

            <textarea
                id="premio_descricao"
            ></textarea>
        </div>


        <div class="form-group">
            <label>Descrição da ação</label>

            <textarea
                id="descricao"
            ></textarea>
        </div>


        <div class="form-group">
            <label>URL da foto do prêmio</label>

            <input
                type="text"
                id="foto_url"
            >
        </div>


        <div class="form-group">
            <label>Valor de cada número</label>

            <input
                type="number"
                id="valor_numero"
                step="0.01"
                min="0"
                required
            >
        </div>


        <div class="form-group">
            <label>Total de números</label>

            <input
                type="number"
                id="total_numeros"
                min="1"
                max="100000"
                required
            >
        </div>


        <div class="form-group">
            <label>Quantidade</label>

            <input
                type="number"
                id="quantidade"
                min="1"
            >
        </div>


        <div class="form-group">
            <label>Data e hora do sorteio</label>

            <input
                type="datetime-local"
                id="data_sorteio"
            >
        </div>


        <div class="form-group">
            <label>Link de pagamento</label>

            <input
                type="text"
                id="link_pagamento"
            >
        </div>


        <div class="form-group">
            <label>Observações</label>

            <textarea
                id="observacoes"
            ></textarea>
        </div>


        <button
            type="submit"
            class="btn"
            id="btnCriar"
        >
            Criar ação
        </button>

    </form>

    <div id="mensagem"></div>

</div>


<script>

const URL_SUPABASE =
    "https://vlirpvuramslfiftshio.supabase.co";


const CHAVE_SUPABASE =
    "sb_publishable_xsvg1O6hHgmpbv1D_10PRw_xOysBwuj";


const clienteSupabase =
    window.supabase.createClient(
        URL_SUPABASE,
        CHAVE_SUPABASE
    );


/* =========================
   VERIFICAR SESSÃO
========================= */

async function verificarSessao() {

    const resultado =
        await clienteSupabase.auth.getSession();

    const sessao =
        resultado.data.session;

    if (sessao) {

        document.getElementById(
            "login"
        ).style.display = "none";

        document.getElementById(
            "painel"
        ).style.display = "block";

    } else {

        document.getElementById(
            "login"
        ).style.display = "block";

        document.getElementById(
            "painel"
        ).style.display = "none";
    }
}


/* =========================
   LOGIN
========================= */

document
    .getElementById("btnLogin")
    .addEventListener(
        "click",
        async function () {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const senha =
                document
                    .getElementById("senha")
                    .value;

            const mensagem =
                document.getElementById(
                    "loginMensagem"
                );

            mensagem.textContent =
                "Entrando...";

            const resultado =
                await clienteSupabase.auth
                    .signInWithPassword({

                        email: email,

                        password: senha

                    });

            if (resultado.error) {

                console.error(
                    resultado.error
                );

                mensagem.textContent =
                    "Erro: " +
                    resultado.error.message;

                return;
            }

            mensagem.textContent = "";

            await verificarSessao();
        }
    );


/* =========================
   SAIR
========================= */

document
    .getElementById("btnSair")
    .addEventListener(
        "click",
        async function () {

            await clienteSupabase
                .auth
                .signOut();

            await verificarSessao();
        }
    );


/* =========================
   CRIAR AÇÃO
========================= */

document
    .getElementById("formAcao")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();

            const mensagem =
                document.getElementById(
                    "mensagem"
                );

            const btnCriar =
                document.getElementById(
                    "btnCriar"
                );

            mensagem.textContent =
                "Criando ação...";

            btnCriar.disabled = true;

            try {

                /* =========================
                   DADOS DA AÇÃO
                ========================= */

                const nome =
                    document
                        .getElementById("nome")
                        .value
                        .trim();

                const descricao =
                    document
                        .getElementById("descricao")
                        .value
                        .trim();

                const foto_url =
                    document
                        .getElementById("foto_url")
                        .value
                        .trim();

                const valor_numero =
                    Number(
                        document
                            .getElementById(
                                "valor_numero"
                            )
                            .value
                    );

                const total_numeros =
                    Number(
                        document
                            .getElementById(
                                "total_numeros"
                            )
                            .value
                    );


                /* =========================
                   CRIAR AÇÃO
                ========================= */

                const resultado =
                    await clienteSupabase

                        .from("AÇÕES")

                        .insert([{

                            nome:
                                nome,

                            descricao:
                                descricao,

                            foto_url:
                                foto_url,

                            valor_numero:
                                valor_numero,

                            total_numeros:
                                total_numeros,

                            status:
                                "ativa"

                        }])

                        .select("id")

                        .single();


                if (resultado.error) {

                    console.error(
                        resultado.error
                    );

                    mensagem.textContent =
                        "Erro ao criar ação: " +
                        resultado.error.message;

                    return;
                }


                const acaoId =
                    resultado.data.id;


                /* =========================
                   GERAR NÚMEROS
                ========================= */

                mensagem.textContent =
                    "Ação criada. Gerando números...";


                const resultadoNumeros =
                    await clienteSupabase
                        .rpc(
                            "gerar_numeros_acao",
                            {
                                p_acao_id:
                                    acaoId
                            }
                        );


                if (resultadoNumeros.error) {

                    console.error(
                        resultadoNumeros.error
                    );

                    mensagem.textContent =
                        "Ação criada, mas houve erro ao gerar os números: " +
                        resultadoNumeros.error.message;

                    return;
                }


                /* =========================
                   SUCESSO
                ========================= */

                mensagem.textContent =
                    "Ação criada e " +
                    total_numeros +
                    " números gerados com sucesso!";


                document
                    .getElementById(
                        "formAcao"
                    )
                    .reset();

            }

            catch (erro) {

                console.error(erro);

                mensagem.textContent =
                    "Erro inesperado: " +
                    erro.message;

            }

            finally {

                btnCriar.disabled = false;

            }

        }
    );


/* =========================
   INICIAR
========================= */

verificarSessao();

</script>

</body>
</html>
