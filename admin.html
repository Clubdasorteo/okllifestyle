<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Administração - OKL Lifestyle</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #000;
    color: #fff;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 20px;
}

h1,
h2,
h3 {
    margin-top: 0;
}

h1 {
    color: #d4af37;
    text-align: center;
    margin-bottom: 25px;
}

h2 {
    color: #d4af37;
}

label {
    display: block;
    margin-top: 14px;
    margin-bottom: 6px;
    font-weight: bold;
}

input,
textarea,
select {
    width: 100%;
    padding: 12px;
    border-radius: 7px;
    border: 1px solid #444;
    background: #111;
    color: #fff;
    font-size: 15px;
}

textarea {
    min-height: 90px;
    resize: vertical;
}

button {
    border: none;
    border-radius: 7px;
    padding: 12px 15px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.btn-principal {
    width: 100%;
    background: #d4af37;
    color: #000;
    margin-top: 18px;
}

.btn-secundario {
    background: #222;
    color: #fff;
    border: 1px solid #444;
}

.btn-editar {
    background: #d4af37;
    color: #000;
    margin-top: 10px;
}

.btn-numeros {
    background: #222;
    color: #d4af37;
    border: 1px solid #d4af37;
    margin-top: 10px;
}

.btn-fechar {
    background: #222;
    color: #fff;
    border: 1px solid #555;
}

.btn-sair {
    background: #8b0000;
    color: #fff;
    margin-bottom: 20px;
}

.caixa {
    background: #0b0b0b;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 20px;
}

.mensagem {
    margin-top: 12px;
    padding: 10px;
    border-radius: 7px;
    display: none;
}

.mensagem.sucesso {
    display: block;
    background: #123d20;
    color: #8ff0a4;
}

.mensagem.erro {
    display: block;
    background: #4a1111;
    color: #ff8c8c;
}

#painelAdmin {
    display: none;
}

#secaoEditor {
    display: none;
}

.acao-card {
    background: #101010;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 15px;
}

.acao-card img {
    width: 100%;
    max-height: 260px;
    object-fit: contain;
    background: #000;
    border-radius: 8px;
    margin-bottom: 12px;
}

.acao-nome {
    color: #d4af37;
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 8px;
}

.acao-info {
    color: #ccc;
    line-height: 1.6;
}

.status {
    display: inline-block;
    padding: 5px 9px;
    border-radius: 5px;
    font-size: 12px;
    font-weight: bold;
    margin-top: 8px;
}

.status-ativa {
    background: #176b32;
    color: #fff;
}

.status-finalizada {
    background: #555;
    color: #fff;
}

.status-pausada {
    background: #8a6500;
    color: #fff;
}

.preview-foto {
    display: none;
    width: 100%;
    max-height: 220px;
    object-fit: contain;
    background: #000;
    border-radius: 8px;
    margin-top: 10px;
}

/* =========================
   MAPA DE NÚMEROS
========================= */

.numeros-painel {
    display: none;
    margin-top: 18px;
    padding: 15px;
    background: #080808;
    border: 1px solid #333;
    border-radius: 12px;
}

.numeros-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
}

.numeros-header h3 {
    color: #d4af37;
    margin: 0;
}

.numeros-resumo {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-bottom: 15px;
}

.resumo-item {
    background: #151515;
    border: 1px solid #333;
    border-radius: 7px;
    padding: 8px 4px;
    text-align: center;
    font-size: 12px;
}

.resumo-item strong {
    display: block;
    font-size: 17px;
    margin-top: 3px;
}

.resumo-disponivel strong {
    color: #fff;
}

.resumo-reservado strong {
    color: #ffd21c;
}

.resumo-vendido strong {
    color: #48d86a;
}

.numeros-legenda {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin-bottom: 15px;
}

.legenda-item {
    padding: 6px 9px;
    border-radius: 6px;
    font-size: 12px;
    border: 1px solid #444;
}

.legenda-disponivel {
    background: #222;
    color: #fff;
}

.legenda-reservado {
    background: #8a6500;
    color: #fff;
}

.legenda-vendido {
    background: #176b32;
    color: #fff;
}

.grade-numeros {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
    max-height: 500px;
    overflow-y: auto;
    padding-right: 3px;
}

.numero-box {
    min-height: 43px;
    border-radius: 6px;
    border: 1px solid #444;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex-direction: column;
    cursor: pointer;
    font-weight: bold;
    font-size: 13px;
    transition: 0.15s;
}

.numero-box:hover {
    transform: scale(1.04);
}

.numero-disponivel {
    background: #222;
    color: #fff;
}

.numero-reservado {
    background: #8a6500;
    color: #fff;
    border-color: #d4af37;
}

.numero-vendido {
    background: #176b32;
    color: #fff;
    border-color: #62dc7c;
}

.numero-tempo {
    display: block;
    font-size: 9px;
    margin-top: 3px;
    font-weight: normal;
}

.info-numero {
    display: none;
    margin-top: 15px;
    padding: 13px;
    background: #151515;
    border: 1px solid #333;
    border-radius: 8px;
    line-height: 1.7;
    color: #ddd;
}

.info-numero strong {
    color: #d4af37;
}

.carregando {
    color: #aaa;
    text-align: center;
    padding: 20px;
}

@media (max-width: 400px) {

    .grade-numeros {
        grid-template-columns: repeat(4, 1fr);
    }

    .numero-box {
        min-height: 40px;
        font-size: 12px;
    }

}

</style>
</head>

<body>

<div class="container">

    <!-- LOGIN -->

    <div id="telaLogin">

        <h1>🔐 Administração</h1>

        <div class="caixa">

            <label for="loginEmail">
                E-mail
            </label>

            <input
                type="email"
                id="loginEmail"
                placeholder="Seu e-mail"
            >

            <label for="loginSenha">
                Senha
            </label>

            <input
                type="password"
                id="loginSenha"
                placeholder="Sua senha"
            >

            <button
                id="btnLogin"

            >
                Entrar
            </button>

            <div
                id="loginMensagem"
                class="mensagem"
            ></div>

        </div>

    </div>


    <!-- PAINEL ADMIN -->

    <div id="painelAdmin">

        <h1>⚙️ Painel Administrativo</h1>

        <button
            id="btnLogout"
            class="btn-sair"
        >
            Sair
        </button>


        <!-- AÇÕES -->

        <div class="caixa">

            <div style="
                display:flex;
                justify-content:space-between;
                align-items:center;
                gap:10px;
            ">

                <h2>Ações cadastradas</h2>

                <button
                    id="btnAtualizar"
                    class="btn-secundario"
                >
                    🔄 Atualizar
                </button>

            </div>

            <div id="listaAcoes"></div>

            <div
                id="listaMensagem"
                class="mensagem"
            ></div>

        </div>


        <!-- MAPA DE NÚMEROS -->

        <div
            id="numerosPainel"
            class="numeros-painel"
        >

            <div class="numeros-header">

                <h3 id="numerosTitulo">
                    🎟️ Números da ação
                </h3>

                <button
                    id="btnFecharNumeros"
                    class="btn-fechar"
                >
                    Fechar
                </button>

            </div>

            <div
                id="numerosResumo"
                class="numeros-resumo"
            ></div>

            <div class="numeros-legenda">

                <div class="legenda-item legenda-disponivel">
                    ⚪ Disponível
                </div>

                <div class="legenda-item legenda-reservado">
                    🟡 Reservado
                </div>

                <div class="legenda-item legenda-vendido">
                    🟢 Vendido
                </div>

            </div>

            <div
                id="gradeNumeros"
                class="grade-numeros"
            ></div>

            <div
                id="numeroInfo"
                class="info-numero"
            ></div>

        </div>


        <!-- EDITAR AÇÃO -->

        <div
            id="secaoEditor"
            class="caixa"
        >

            <h2>✏️ Editar ação</h2>

            <input
                type="hidden"
                id="editar_id"
            >

            <label>
                Nome da ação
            </label>

            <input
                type="text"
                id="editar_nome"
            >

            <label>
                Descrição
            </label>

            <textarea
                id="editar_descricao"
            ></textarea>

            <label>
                Valor por número
            </label>

            <input
                type="number"
                step="0.01"
                id="editar_valor"
            >

            <label>
                Total de números

            <input

            >

            <label>
                Status
            </label>

            <select id="editar_status">

                <option value="ativa">
                    Ativa

                <option value="pausada">
                    Pausada

                <option value="finalizada">
                    Finalizada
                </option>

            </select>

            <input
                type="hidden"
                id="editarFotoAtual"
            >

            <label>
                Alterar foto do prêmio
            </label>

            <input
                type="file"
                id="editar_foto"
                accept="image/*"
            >

            <img
                id="editarFotoPreview"

                alt="Prévia da foto"
            >

            <button
                id="btnSalvarEdicao"
                class="btn-principal"
            >
                💾 Salvar alterações
            </button>

            <button
                id="btnCancelarEdicao"
                class="btn-secundario"
                style="width:100%;margin-top:10px;"
            >
                Cancelar
            </button>

            <div
                id="editarMensagem"
                class="mensagem"
            ></div>

        </div>


        <!-- NOVA AÇÃO -->

        <div class="caixa">

            <h2>➕ Nova ação</h2>

            <label>
                Nome da ação
            </label>

            <input
                type="text"
                id="nome"
                placeholder="Ex.: AÇÃO ROKR"
            >

            <label>
                Prêmio
            </label>

            <input
                type="text"
                id="premio"
                placeholder="Nome do prêmio"
            >

            <label>
                Descrição do prêmio
            </label>

            <textarea
                id="premio_descricao"
                placeholder="Descrição do prêmio"
            ></textarea>

            <label>
                Descrição da ação
            </label>

            <textarea
                id="descricao"
                placeholder="Descrição da ação"
            ></textarea>

            <label>
                Foto do prêmio
            </label>

            <input

                id="foto"

            >

                id="fotoPreview"
                class="preview-foto"
                alt="Prévia da foto"
            >

            <label>
                Valor por número
            </label>

            <input
                type="number"
                step="0.01"
                id="valor_numero"
                placeholder="Ex.: 10"
            >

            <label>
                Total de números
            </label>

            <input
                type="number"
                id="total_numeros"
                placeholder="Ex.: 100"
                min="1"
                max="100000"
            >

            <label>
                Quantidade
            </label>

            <input
                type="number"
                id="quantidade"
                placeholder="Quantidade"
            >

            <label>
                Data do sorteio
            </label>

            <input
                type="datetime-local"
                id="data_sorteio"
            >

            <label>
                Link de pagamento
            </label>

            <input
                type="text"
                id="link_pagamento"
                placeholder="Link"
            >

            <label>
                Observações

            <textarea
                id="observacoes"
                placeholder="Observações"
            ></textarea>

            <button
                id="btnCriarAcao"

            </button>

    </div>

</div>


<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://vlirpvuramslfiftshio.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_xsvg1O6hHgmpbv1D_10PRw_xOysBwuj";

const NOME_BUCKET =
    "fotos-premios";

const clienteSupabase =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   VARIÁVEIS
========================= */

let acaoNumerosAtual = null;

let numerosAtuais = [];

let numeroSelecionado = null;

let intervaloMapa = null;

let intervaloContadores = null;


/* =========================
   ELEMENTOS
========================= */

const telaLogin =
    document.getElementById("telaLogin");

const painelAdmin =
    document.getElementById("painelAdmin");

const secaoEditor =
    document.getElementById("secaoEditor");

const listaAcoes =
    document.getElementById("listaAcoes");


/* =========================
   UTILITÁRIOS
========================= */

function escapeHtml(valor) {

    if (valor === null || valor === undefined) {
        return "";
    }

    return String(valor)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function formatarMoeda(valor) {

    return Number(valor || 0)
        .toLocaleString("pt-BR", {
            style: "currency",
            currency: "BRL"
        });

}


function formatarNumero(numero) {

    const n = Number(numero);

    if (n <= 99) {
        return String(n).padStart(2, "0");
    }

    return String(n);
}


function mostrarMensagem(
    elemento,
    texto,
    tipo
) {

    elemento.textContent = texto;

    elemento.className =
        "mensagem " + tipo;

}


/* =========================
   SESSÃO
========================= */

async function verificarSessao() {

    const {
        data
    } = await clienteSupabase
        .auth
        .getSession();

    if (
        data &&
        data.session
    ) {

        telaLogin.style.display = "none";

        painelAdmin.style.display = "block";

        await carregarAcoes();

    } else {

        telaLogin.style.display = "block";

        painelAdmin.style.display = "none";

    }

}


/* =========================
   LOGIN
========================= */

document
    .getElementById("btnLogin")
    .addEventListener(
        "click",
        async function() {

            const email =
                document
                    .getElementById("loginEmail")
                    .value
                    .trim();

            const senha =
                document
                    .getElementById("loginSenha")
                    .value;

            const mensagem =
                document
                    .getElementById("loginMensagem");

            mensagem.className =
                "mensagem";

            mensagem.textContent = "";

            const resultado =
                await clienteSupabase
                    .auth
                    .signInWithPassword({
                        email: email,
                        password: senha
                    });

            if (resultado.error) {

                mostrarMensagem(
                    mensagem,
                    resultado.error.message,
                    "erro"
                );

                return;
            }

            telaLogin.style.display = "none";

            painelAdmin.style.display = "block";

            await carregarAcoes();

        }
    );


/* =========================
   LOGOUT
========================= */

document
    .getElementById("btnLogout")
    .addEventListener(
        "click",
        async function() {

            await clienteSupabase
                .auth
                .signOut();

            location.reload();

        }
    );


/* =========================
   CARREGAR AÇÕES
========================= */

async function carregarAcoes() {

    listaAcoes.innerHTML =
        '<div class="carregando">Carregando ações...</div>';

    const resultado =
        await clienteSupabase
            .from("AÇÕES")
            .select(`
                id,
                nome,
                descricao,
                foto_url,
                valor_numero,
                total_numeros,
                status,
                created_at
            `)
            .order(
                "created_at",
                {
                    ascending: false
                }
            );

    if (resultado.error) {

        console.error(resultado.error);

        listaAcoes.innerHTML =
            "<p>❌ Erro ao carregar ações.</p>";

        return;
    }

    listaAcoes.innerHTML = "";

    const acoes =
        resultado.data || [];

    if (acoes.length === 0) {

        listaAcoes.innerHTML =
            "<p>Nenhuma ação cadastrada.</p>";

        return;
    }

    acoes.forEach(
        function(acao) {

            const card =
                document.createElement("div");

            card.className =
                "acao-card";

            let classeStatus =
                "status-ativa";

            if (
                acao.status === "finalizada"
            ) {

                classeStatus =
                    "status-finalizada";

            } else if (
                acao.status === "pausada"
            ) {

                classeStatus =
                    "status-pausada";

            }

            card.innerHTML = `

                ${
                    acao.foto_url
                    ?
                    `<img
                        src="${escapeHtml(acao.foto_url)}"
                        alt="Foto do prêmio"
                    >`
                    :
                    ""
                }

                <div class="acao-nome">
                    ${escapeHtml(acao.nome)}
                </div>

                <div class="acao-info">

                    <strong>Valor:</strong>
                    ${formatarMoeda(acao.valor_numero)}
                    <br>

                    <strong>Total:</strong>
                    ${acao.total_numeros || 0}
                    números
                    <br>

                    <strong>Status:</strong>
                    <span class="status ${classeStatus}">
                        ${escapeHtml(acao.status || "")}
                    </span>

                    ${
                        acao.descricao
                        ?
                        `<br><br>
                        ${escapeHtml(acao.descricao)}`
                        :
                        ""
                    }

                </div>

                <button
                    type="button"
                    class="btn btn-editar"
                >
                    ✏️ Editar ação
                </button>

                <button
                    type="button"
                    class="btn btn-numeros"
                >
                    🎟️ Ver números
                </button>

            `;

            listaAcoes.appendChild(card);

            const botaoEditar =
                card.querySelector(
                    ".btn-editar"
                );

            botaoEditar.addEventListener(
                "click",
                function() {

                    abrirEditor(acao);

                }
            );

            const botaoNumeros =
                card.querySelector(
                    ".btn-numeros"
                );

            botaoNumeros.addEventListener(
                "click",
                function() {

                    abrirMapaNumeros(acao);

                }
            );

        }
    );

}


/* =========================
   EDITOR
========================= */

function abrirEditor(acao) {

    secaoEditor.style.display =
        "block";

    document
        .getElementById("editar_id")
        .value =
        acao.id;

    document
        .getElementById("editar_nome")
        .value =
        acao.nome || "";

    document
        .getElementById("editar_descricao")
        .value =
        acao.descricao || "";

    document
        .getElementById("editar_valor")
        .value =
        acao.valor_numero || "";

    document
        .getElementById("editar_total")
        .value =
        acao.total_numeros || "";

    document
        .getElementById("editar_status")
        .value =
        acao.status || "ativa";

    document
        .getElementById("editarFotoAtual")
        .value =
        acao.foto_url || "";

    const preview =
        document
            .getElementById("editarFotoPreview");

    if (acao.foto_url) {

        preview.src =
            acao.foto_url;

        preview.style.display =
            "block";

    } else {

        preview.style.display =
            "none";

    }

    secaoEditor.scrollIntoView({
        behavior: "smooth"
    });

}


document
    .getElementById("btnCancelarEdicao")
    .addEventListener(
        "click",
        function() {

            secaoEditor.style.display =
                "none";

        }
    );


/* =========================
   PREVIEW FOTO EDIÇÃO
========================= */

document
    .getElementById("editar_foto")
    .addEventListener(
        "change",
        function(event) {

            const arquivo =
                event.target.files[0];

            const preview =
                document
                    .getElementById(
                        "editarFotoPreview"
                    );

            if (!arquivo) {

                return;

            }

            preview.src =
                URL.createObjectURL(
                    arquivo
                );

            preview.style.display =
                "block";

        }
    );


/* =========================
   PREVIEW NOVA FOTO
========================= */

document
    .getElementById("foto")
    .addEventListener(
        "change",
        function(event) {

            const arquivo =
                event.target.files[0];

            const preview =
                document
                    .getElementById(
                        "fotoPreview"
                    );

            if (!arquivo) {

                return;

            }

            preview.src =
                URL.createObjectURL(
                    arquivo
                );

            preview.style.display =
                "block";

        }
    );


/* =========================
   UPLOAD FOTO
========================= */

async function enviarFoto(arquivo) {

    if (!arquivo) {
        return "";
    }

    const extensao =
        arquivo.name
            .split(".")
            .pop()
            .toLowerCase();

    const nomeArquivo =
        Date.now()
        + "-"
        + crypto.randomUUID()
        + "."
        + extensao;

    const resultadoUpload =
        await clienteSupabase
            .storage
            .from(NOME_BUCKET)
            .upload(
                nomeArquivo,
                arquivo,
                {
                    cacheControl: "3600",
                    upsert: false,
                    contentType:
                        arquivo.type
                }
            );

    if (resultadoUpload.error) {

        throw resultadoUpload.error;

    }

    const resultadoUrl =
        clienteSupabase
            .storage
            .from(NOME_BUCKET)
            .getPublicUrl(
                nomeArquivo
            );

    return resultadoUrl
        .data
        .publicUrl;

}

/* =========================
   CARREGAR NÚMEROS
========================= */

async function carregarNumeros(
    acaoId
) {

    const grade =
        document
            .getElementById(
                "gradeNumeros"
            );

    const resumo =
        document
            .getElementById(
                "numerosResumo"
            );

    const info =
        document
            .getElementById(
                "numeroInfo"
            );

    const resultadoNumeros =
        await clienteSupabase
            .from("numeros")
            .select(`
                numero,
                status,
                pedido_id,
                reservado_em,
                reservado_ate
            `)
            .eq(
                "acao_id",
                acaoId
            )
            .order(
                "numero",
                {
                    ascending: true
                }
            );

    if (resultadoNumeros.error) {

        console.error(
            resultadoNumeros.error
        );

        grade.innerHTML =
            "❌ Erro ao carregar números.";

        return;

    }

    const numeros =
        resultadoNumeros.data || [];

    const pedidoIds =
        [
            ...new Set(
                numeros
                    .map(
                        numero =>
                            numero.pedido_id
                    )
                    .filter(Boolean)
            )
        ];

    let pedidosMap = {};

    if (pedidoIds.length > 0) {

        const resultadoPedidos =
            await clienteSupabase
                .from("pedidos")
                .select(`
                    id,
                    nome_cliente,
                    telefone,
                    quantidade,
                    valor_total,
                    status
                `)
                .in(
                    "id",
                    pedidoIds
                );

        if (
            resultadoPedidos.error
        ) {

            console.error(
                resultadoPedidos.error
            );

        } else {

            (resultadoPedidos.data || [])
                .forEach(
                    pedido => {

                        pedidosMap[
                            pedido.id
                        ] = pedido;

                    }
                );

        }

    }

    numerosAtuais =
        numeros.map(
            numero => ({
                ...numero,
                pedido:
                    numero.pedido_id
                    ?
                    pedidosMap[
                        numero.pedido_id
                    ]
                    :
                    null
            })
        );

    const disponiveis =
        numerosAtuais.filter(
            n =>
                n.status ===
                "disponivel"
        ).length;

    const reservados =
        numerosAtuais.filter(
            n =>
                n.status ===
                "reservado"
        ).length;

    const vendidos =
        numerosAtuais.filter(
            n =>
                n.status ===
                "vendido"
        ).length;

    resumo.innerHTML = `

        <div class="resumo-item resumo-disponivel">
            Disponíveis
            <strong>${disponiveis}</strong>
        </div>

        <div class="resumo-item resumo-reservado">
            Reservados
            <strong>${reservados}</strong>
        </div>

        <div class="resumo-item resumo-vendido">
            Vendidos
            <strong>${vendidos}</strong>
        </div>

    `;

    grade.innerHTML = "";

    numerosAtuais.forEach(
        numero => {

            const box =
                document.createElement(
                    "div"
                );

            box.className =
                "numero-box";

            if (
                numero.status ===
                "reservado"
            ) {

                box.classList.add(
                    "numero-reservado"
                );

            } else if (
                numero.status ===
                "vendido"
            ) {

                box.classList.add(
                    "numero-vendido"
                );

            } else {

                box.classList.add(
                    "numero-disponivel"
                );

            }

            const numeroTexto =
                document.createElement(
                    "span"
                );

            numeroTexto.textContent =
                formatarNumero(
                    numero.numero
                );

            box.appendChild(
                numeroTexto
            );

            if (
                numero.status ===
                "reservado"
            ) {

                const tempo =
                    document.createElement(
                        "span"
                    );

                tempo.className =
                    "numero-tempo";

                tempo.dataset.expira =
                    numero.reservado_ate || "";

                tempo.textContent =
                    calcularTempoRestante(
                        numero.reservado_ate
                    );

                box.appendChild(
                    tempo
                );

            }

            box.addEventListener(
                "click",
                function() {

                    mostrarDetalhesNumero(
                        numero
                    );

                }
            );

            grade.appendChild(
                box
            );

        }
    );

    if (
        numeroSelecionado
    ) {

        const atual =
            numerosAtuais.find(
                n =>
                    Number(n.numero) ===
                    Number(
                        numeroSelecionado
                            .numero
                    )
            );

        if (atual) {

            numeroSelecionado =
                atual;

            mostrarDetalhesNumero(
                atual
            );

        }

    }

}

) {

    numeroSelecionado =
        numero;

        document
            .getElementById(
                "numeroInfo"
            );

    let html = `

        <strong>🎟️ Número:</strong>
        ${formatarNumero(numero.numero)}
        <br>

        <strong>📌 Status:</strong>
        ${escapeHtml(
            numero.status ||
            "disponivel"
        )}

        <br>

    `;

    if (
        numero.status ===
        "reservado"
    ) {

        html += `

            <strong>⏳ Reserva até:</strong>
            ${
                numero.reservado_ate
                ?
                new Date(
                    numero.reservado_ate
                ).toLocaleString(
                    "pt-BR"
                )
                :
                "Não informado"
            }

            <br>

            <strong>⏱️ Tempo restante:</strong>
            ${calcularTempoRestante(
                numero.reservado_ate
            )}

            <br>

        `;

    }

    if (
        numero.pedido
    ) {

        const pedido =
            numero.pedido;

        html += `

            <hr style="
                border:0;
                border-top:1px solid #333;
                margin:10px 0;
            ">

            <strong>👤 Cliente:</strong>
            ${escapeHtml(
                pedido.nome_cliente
            )}
            <br>

            <strong>📱 WhatsApp:</strong>
            ${escapeHtml(
                pedido.telefone
            )}
            <br>

            <strong>🎟️ Quantidade no pedido:</strong>
            ${pedido.quantidade || 0}
            <br>

            <strong>💰 Valor total:</strong>
            ${formatarMoeda(
                pedido.valor_total
            )}
            <br>

            <strong>📦 Pedido:</strong>
            #${numero.pedido_id}
            <br>

            <strong>📌 Status do pedido:</strong>
            ${escapeHtml(
                pedido.status
            )}

        `;

    } else {

        html += `

            <br>

            <span style="color:#999;">
                Este número ainda não possui pedido vinculado.
            </span>

        `;

    }

    info.innerHTML =
        html;

    info.style.display =
        "block";

}


/* =========================
   CONTADOR DE RESERVA
========================= */

function calcularTempoRestante(
    data
) {

    if (!data) {

        return "--";

    }

    const agora =
        new Date();

    const fim =
        new Date(data);

    const diferenca =
        fim - agora;

    if (
        diferenca <= 0
    ) {

        return "Expirado";

    }

    const minutos =
        Math.floor(
            diferenca /
            60000
        );

    const segundos =
        Math.floor(
            (diferenca %
                60000) /
            1000
        );

    return (
        minutos +
        "m " +
        String(segundos)
            .padStart(2, "0") +
        "s"
    );

}


function atualizarContadores() {

    document
        .querySelectorAll(
            ".numero-tempo"
        )
        .forEach(
            elemento => {

                elemento.textContent =
                    calcularTempoRestante(
                        elemento.dataset.expira
                    );

            }
        );

}


/* =========================
   ATUALIZAÇÃO AUTOMÁTICA
========================= */

function iniciarAtualizacaoMapa() {

    if (
        intervaloMapa
    ) {

        clearInterval(
            intervaloMapa
        );

    }

    if (
        intervaloContadores
    ) {

        clearInterval(
            intervaloContadores
        );

    }

    intervaloMapa =
        setInterval(
            async function() {

                if (
                    acaoNumerosAtual
                ) {

                    await carregarNumeros(
                        acaoNumerosAtual.id
                    );

                }

            },
            5000
        );

    intervaloContadores =
        setInterval(
            atualizarContadores,
            1000
        );

}
