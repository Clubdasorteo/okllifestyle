<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Painel Administrativo - Club da Sorte</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #000;
            color: #fff;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            background: #151515;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #d4af37;
            margin-bottom: 25px;
        }

        h2 {
            color: #d4af37;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 6px;
            background: #222;
            color: #fff;
            font-size: 16px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input[type="file"] {
            padding: 10px;
            cursor: pointer;
        }

        button {
            cursor: pointer;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background: #d4af37;
            color: #000;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-sair {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #444;
            color: #fff;
            margin-bottom: 25px;
        }

        .btn-atualizar {
            background: #222;
            color: #d4af37;
            border: 1px solid #d4af37;
            margin-bottom: 20px;
        }

        .btn-editar {
            background: #d4af37;
            color: #000;
            margin-top: 15px;
        }

        .btn-cancelar {
            background: #444;
            color: #fff;
        }

        #painel {
            display: none;
        }

        #mensagem,
        #loginMensagem,
        #listaMensagem {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }

        .foto-preview {
            display: none;
            width: 100%;
            max-height: 350px;
            object-fit: contain;
            margin-top: 12px;
            border-radius: 10px;
            border: 1px solid #444;
            background: #000;
        }

        .foto-info {
            color: #999;
            font-size: 13px;
            margin-top: 7px;
        }

        .separador {
            height: 1px;
            background: #333;
            margin: 25px 0;
        }

        .acao-card {
            background: #0d0d0d;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .acao-card img {
            width: 100%;
            max-height: 260px;
            object-fit: contain;
            border-radius: 10px;
            background: #000;
            margin-bottom: 12px;
        }

        .acao-nome {
            font-size: 20px;
            font-weight: bold;
            color: #d4af37;
            margin-bottom: 10px;
        }

        .acao-info {
            color: #ddd;
            font-size: 14px;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            padding: 4px 9px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 8px;
        }

        .status-ativa {
            background: #173b20;
            color: #65d47a;
            border: 1px solid #2d743d;
        }

        .status-inativa {
            background: #3b1717;
            color: #ff7777;
            border: 1px solid #743333;
        }

        .sem-acoes {
            text-align: center;
            color: #999;
            padding: 20px 0;
        }

        #editor {
            display: none;
            background: #0d0d0d;
            border: 1px solid #d4af37;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }

        .editor-titulo {
            color: #d4af37;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .foto-atual {
            width: 100%;
            max-height: 280px;
            object-fit: contain;
            border-radius: 10px;
            background: #000;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>

<div class="container" id="login">

    <h1>Acesso administrativo</h1>

    <div class="form-group">
        <label>E-mail</label>

        <input
            type="email"
            id="email"
            autocomplete="email"
        >
    </div>

    <div class="form-group">
        <label>Senha</label>

        <input
            type="password"
            id="senha"
            autocomplete="current-password"
        >
    </div>

    <button
        type="button"
        class="btn"
        id="btnLogin"
    >
        Entrar
    </button>

    <div id="loginMensagem"></div>

</div>


<div class="container" id="painel">

    <h1>Painel Administrativo</h1>

    <button
        type="button"
        class="btn-sair"
        id="btnSair"
    >
        Sair
    </button>


    <!-- =========================
         AÇÕES CADASTRADAS
    ========================= -->

    <h2>🎯 Ações cadastradas</h2>

    <button
        type="button"
        class="btn btn-atualizar"
        id="btnAtualizar"
    >
        🔄 Atualizar lista
    </button>

    <div id="listaAcoes"></div>

    <div id="listaMensagem"></div>


    <!-- =========================
         EDITOR
    ========================= -->

    <div id="editor">

        <div class="editor-titulo">
            ✏️ Editar ação
        </div>

        <form id="formEditar">

            <input
                type="hidden"
                id="editar_id"
            >

            <div class="form-group">

                <label>Nome da ação</label>

                <input
                    type="text"
                    id="editar_nome"
                    required
                >

            </div>


            <div class="form-group">

                <label>Descrição da ação</label>

                <textarea
                    id="editar_descricao"
                ></textarea>

            </div>


            <div class="form-group">

                <label>💰 Valor de cada número</label>

                <input
                    type="number"
                    id="editar_valor"
                    step="0.01"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label>🎟️ Total de números</label>

                <input
                    type="number"
                    id="editar_total"
                    min="1"
                    max="100000"
                    required
                >

            </div>


            <div class="form-group">

                <label>📌 Status</label>

                <select id="editar_status">

                    <option value="ativa">
                        Ativa
                    </option>

                    <option value="inativa">
                        Inativa
                    </option>

                    <option value="encerrada">
                        Encerrada
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>📸 Foto atual</label>

                <img
                    id="editarFotoAtual"
                    class="foto-atual"
                    alt="Foto atual"
                >

            </div>


            <div class="form-group">

                <label>📸 Trocar foto</label>

                <input
                    type="file"
                    id="editar_foto"
                    accept="image/jpeg,image/png,image/webp"
                >

                <div class="foto-info">
                    Se não selecionar uma nova foto, a foto atual será mantida.
                </div>

                <img
                    id="editarFotoPreview"
                    class="foto-preview"
                    alt="Nova foto"
                >

            </div>


            <button
                type="submit"
                class="btn"
                id="btnSalvarEdicao"
            >
                💾 Salvar alterações
            </button>


            <button
                type="button"
                class="btn btn-cancelar"
                id="btnCancelarEdicao"
            >
                Cancelar
            </button>

        </form>

        <div id="mensagemEdicao"></div>

    </div>


    <div class="separador"></div>


    <!-- =========================
         NOVA AÇÃO
    ========================= -->

    <p>
        <strong>➕ Criar nova ação</strong>
    </p>

    <div class="separador"></div>

    <form id="formAcao">

        <div class="form-group">

            <label>Nome da ação</label>

            <input
                type="text"
                id="nome"
                placeholder="Ex.: ROKR"
                required
            >

        </div>


        <div class="form-group">

            <label>Prêmio</label>

            <input
                type="text"
                id="premio"
                placeholder="Ex.: Relógio ROKR"
                required
            >

        </div>


        <div class="form-group">

            <label>Descrição do prêmio</label>

            <textarea
                id="premio_descricao"
                placeholder="Descreva o prêmio..."
            ></textarea>

        </div>


        <div class="form-group">

            <label>Descrição da ação</label>

            <textarea
                id="descricao"
                placeholder="Informações da ação..."
            ></textarea>

        </div>


        <div class="form-group">

            <label>📸 Foto do prêmio</label>

            <input
                type="file"
                id="foto"
                accept="image/jpeg,image/png,image/webp"
            >

            <div class="foto-info">
                Selecione uma foto do celular ou computador.
            </div>

            <img
                id="fotoPreview"
                class="foto-preview"
                alt="Prévia da foto do prêmio"
            >

        </div>


        <div class="form-group">

            <label>Valor de cada número</label>

            <input
                type="number"
                id="valor_numero"
                step="0.01"
                min="0"
                placeholder="Ex.: 10.00"
                required
            >

        </div>


        <div class="form-group">

            <label>Total de números</label>

            <input
                type="number"
                id="total_numeros"
                min="1"
                max="100000"
                placeholder="Ex.: 1000"
                required
            >

        </div>


        <div class="form-group">

            <label>Quantidade</label>

            <input
                type="number"
                id="quantidade"
                min="1"
                placeholder="Opcional"
            >

        </div>


        <div class="form-group">

            <label>Data e hora do sorteio</label>

            <input
                type="datetime-local"
                id="data_sorteio"
            >

        </div>


        <div class="form-group">

            <label>Link de pagamento</label>

            <input
                type="text"
                id="link_pagamento"
                placeholder="Será configurado posteriormente"
            >

        </div>


        <div class="form-group">

            <label>Observações</label>

            <textarea
                id="observacoes"
                placeholder="Observações internas..."
            ></textarea>

        </div>


        <button
            type="submit"
            class="btn"
            id="btnCriar"
        >
            Criar ação
        </button>

    </form>

    <div id="mensagem"></div>

</div>


<script>

const URL_SUPABASE =
    "https://vlirpvuramslfiftshio.supabase.co";

const CHAVE_SUPABASE =
    "sb_publishable_xsvg1O6hHgmpbv1D_10PRw_xOysBwuj";

const clienteSupabase =
    window.supabase.createClient(
        URL_SUPABASE,
        CHAVE_SUPABASE
    );

const NOME_BUCKET =
    "fotos-premios";


/* =========================
   VERIFICAR SESSÃO
========================= */

async function verificarSessao() {

    const resultado =
        await clienteSupabase.auth.getSession();

    const sessao =
        resultado.data.session;

    if (sessao) {

        document.getElementById(
            "login"
        ).style.display = "none";

        document.getElementById(
            "painel"
        ).style.display = "block";

        carregarAcoes();

    } else {

        document.getElementById(
            "login"
        ).style.display = "block";

        document.getElementById(
            "painel"
        ).style.display = "none";
    }
}


/* =========================
   LOGIN
========================= */

document
    .getElementById("btnLogin")
    .addEventListener(
        "click",
        async function () {

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const senha =
                document
                    .getElementById("senha")
                    .value;

            const mensagem =
                document.getElementById(
                    "loginMensagem"
                );

            mensagem.textContent =
                "Entrando...";

            const resultado =
                await clienteSupabase.auth
                    .signInWithPassword({

                        email: email,

                        password: senha

                    });

            if (resultado.error) {

                mensagem.textContent =
                    "Erro: " +
                    resultado.error.message;

                return;
            }

            mensagem.textContent = "";

            await verificarSessao();
        }
    );


/* =========================
   SAIR
========================= */

document
    .getElementById("btnSair")
    .addEventListener(
        "click",
        async function () {

            await clienteSupabase
                .auth
                .signOut();

            await verificarSessao();
        }
    );


/* =========================
   CARREGAR AÇÕES
========================= */

async function carregarAcoes() {

    const lista =
        document.getElementById(
            "listaAcoes"
        );

    const mensagem =
        document.getElementById(
            "listaMensagem"
        );

    lista.innerHTML = "";

    mensagem.textContent =
        "Carregando ações...";


    const resultado =
        await clienteSupabase
            .from("AÇÕES")
            .select(`
                id,
                nome,
                descricao,
                foto_url,
                valor_numero,
                total_numeros,
                status,
                created_at
            `)
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (resultado.error) {

        console.error(
            resultado.error
        );

        mensagem.textContent =
            "❌ Erro ao carregar ações: " +
            resultado.error.message;

        return;
    }


    const acoes =
        resultado.data || [];


    if (acoes.length === 0) {

        mensagem.textContent = "";

        lista.innerHTML =
            `<div class="sem-acoes">
                Nenhuma ação cadastrada.
            </div>`;

        return;
    }


    mensagem.textContent = "";


    acoes.forEach(
        function (acao) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "acao-card";


            let fotoHTML = "";

            if (acao.foto_url) {

                fotoHTML =
                    `
                    <img
                        src="${acao.foto_url}"
                        alt="Foto da ação"
                    >
                    `;
            }


            const valor =
                Number(
                    acao.valor_numero || 0
                ).toLocaleString(
                    "pt-BR",
                    {
                        style: "currency",
                        currency: "BRL"
                    }
                );


            const classeStatus =
                acao.status === "ativa"
                    ? "status-ativa"
                    : "status-inativa";


            card.innerHTML =

                fotoHTML +

                `
                <div class="acao-nome">
                    ${acao.nome || "Sem nome"}
                </div>

                <div class="acao-info">

                    <strong>💰 Valor por número:</strong>
                    ${valor}
                    <br>

                    <strong>🎟️ Total de números:</strong>
                    ${acao.total_numeros || 0}
                    <br>

                    <strong>📝 Descrição:</strong>
                    ${acao.descricao || "Sem descrição"}
                    <br>

                    <span class="status ${classeStatus}">
                        ${acao.status || "sem status"}
                    </span>

                </div>

                <button
                    type="button"
                    class="btn btn-editar"
                    data-id="${acao.id}"
                >
                    ✏️ Editar ação
                </button>
                `;


            const botaoEditar =
                card.querySelector(
                    ".btn-editar"
                );


            botaoEditar.addEventListener(
                "click",
                function () {

                    abrirEditor(acao);

                }
            );


            lista.appendChild(
                card
            );

        }
    );
}


/* =========================
   ABRIR EDITOR
========================= */

function abrirEditor(acao) {

    document.getElementById(
        "editor"
    ).style.display = "block";


    document.getElementById(
        "editar_id"
    ).value =
        acao.id;


    document.getElementById(
        "editar_nome"
    ).value =
        acao.nome || "";


    document.getElementById(
        "editar_descricao"
    ).value =
        acao.descricao || "";


    document.getElementById(
        "editar_valor"
    ).value =
        acao.valor_numero || "";


    document.getElementById(
        "editar_total"
    ).value =
        acao.total_numeros || "";


    document.getElementById(
        "editar_status"
    ).value =
        acao.status || "ativa";


    const fotoAtual =
        document.getElementById(
            "editarFotoAtual"
        );


    if (acao.foto_url) {

        fotoAtual.src =
            acao.foto_url;

        fotoAtual.style.display =
            "block";

    } else {

        fotoAtual.src = "";

        fotoAtual.style.display =
            "none";
    }


    document.getElementById(
        "editar_foto"
    ).value = "";


    document.getElementById(
        "editarFotoPreview"
    ).style.display =
        "none";


    document.getElementById(
        "mensagemEdicao"
    ).textContent =
        "";


    document.getElementById(
        "editor"
    ).scrollIntoView({
        behavior: "smooth"
    });
}


/* =========================
   PRÉVIA DA NOVA FOTO
========================= */

document
    .getElementById("editar_foto")
    .addEventListener(
        "change",
        function () {

            const arquivo =
                this.files[0];

            const preview =
                document.getElementById(
                    "editarFotoPreview"
                );

            if (!arquivo) {

                preview.src = "";

                preview.style.display =
                    "none";

                return;
            }


            if (!arquivo.type.startsWith("image/")) {

                alert(
                    "Selecione uma imagem válida."
                );

                this.value = "";

                preview.src = "";

                preview.style.display =
                    "none";

                return;
            }


            const url =
                URL.createObjectURL(
                    arquivo
                );


            preview.src =
                url;


            preview.style.display =
                "block";
        }
    );


/* =========================
   SALVAR EDIÇÃO
========================= */

document
    .getElementById("formEditar")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const id =
                document.getElementById(
                    "editar_id"
                ).value;


            const mensagem =
                document.getElementById(
                    "mensagemEdicao"
                );


            const botao =
                document.getElementById(
                    "btnSalvarEdicao"
                );


            botao.disabled = true;


            try {

                const nome =
                    document.getElementById(
                        "editar_nome"
                    ).value.trim();


                const descricao =
                    document.getElementById(
                        "editar_descricao"
                    ).value.trim();


                const valor =
                    Number(
                        document.getElementById(
                            "editar_valor"
                        ).value
                    );


                const total =
                    Number(
                        document.getElementById(
                            "editar_total"
                        ).value
                    );


                const status =
                    document.getElementById(
                        "editar_status"
                    ).value;


                const novaFoto =
                    document.getElementById(
                        "editar_foto"
                    ).files[0];


                let dadosAtualizacao = {

                    nome:
                        nome,

                    descricao:
                        descricao,

                    valor_numero:
                        valor,

                    total_numeros:
                        total,

                    status:
                        status

                };


                /* =========================
                   SE TIVER NOVA FOTO
                ========================= */

                if (novaFoto) {

                    mensagem.textContent =
                        "Enviando nova foto...";


                    const novaFotoUrl =
                        await enviarFoto(
                            novaFoto
                        );


                    dadosAtualizacao.foto_url =
                        novaFotoUrl;
                }


                mensagem.textContent =
                    "Salvando alterações...";


                const resultado =
                    await clienteSupabase

                        .from("AÇÕES")

                        .update(
                            dadosAtualizacao
                        )

                        .eq(
                            "id",
                            id
                        );


                if (resultado.error) {

                    throw new Error(
                        resultado.error.message
                    );
                }


                mensagem.innerHTML =
                    "✅ Alterações salvas com sucesso!";


                await carregarAcoes();


                setTimeout(
                    function () {

                        document.getElementById(
                            "editor"
                        ).style.display =
                            "none";

                    },
                    1200
                );

            }

            catch (erro) {

                console.error(
                    erro
                );

                mensagem.textContent =
                    "❌ " +
                    erro.message;

            }

            finally {

                botao.disabled =
                    false;
            }
        }
    );


/* =========================
   CANCELAR EDIÇÃO
========================= */

document
    .getElementById("btnCancelarEdicao")
    .addEventListener(
        "click",
        function () {

            document.getElementById(
                "editor"
            ).style.display =
                "none";

        }
    );


/* =========================
   BOTÃO ATUALIZAR
========================= */

document
    .getElementById("btnAtualizar")
    .addEventListener(
        "click",
        carregarAcoes
    );


/* =========================
   PRÉVIA DA FOTO — NOVA AÇÃO
========================= */

document
    .getElementById("foto")
    .addEventListener(
        "change",
        function () {

            const arquivo =
                this.files[0];

            const preview =
                document.getElementById(
                    "fotoPreview"
                );


            if (!arquivo) {

                preview.src = "";

                preview.style.display =
                    "none";

                return;
            }


            if (!arquivo.type.startsWith("image/")) {

                alert(
                    "Selecione uma imagem válida."
                );

                this.value = "";

                preview.src = "";

                preview.style.display =
                    "none";

                return;
            }


            const url =
                URL.createObjectURL(
                    arquivo
                );


            preview.src =
                url;


            preview.style.display =
                "block";
        }
    );


/* =========================
   ENVIAR FOTO
========================= */

async function enviarFoto(arquivo) {

    if (!arquivo) {

        return "";
    }


    const extensao =
        arquivo.name
            .split(".")
            .pop()
            .toLowerCase();


    const nomeArquivo =
        Date.now() +
        "-" +
        crypto.randomUUID() +
        "." +
        extensao;


    const resultadoUpload =
        await clienteSupabase

            .storage

            .from(NOME_BUCKET)

            .upload(
                nomeArquivo,
                arquivo,
                {
                    cacheControl: "3600",
                    upsert: false,
                    contentType:
                        arquivo.type
                }
            );


    if (resultadoUpload.error) {

        throw resultadoUpload.error;
    }


    const resultadoUrl =
        clienteSupabase

            .storage

            .from(NOME_BUCKET)

            .getPublicUrl(
                nomeArquivo
            );


    return resultadoUrl
        .data
        .publicUrl;
}


/* =========================
   CRIAR NOVA AÇÃO
========================= */

document
    .getElementById("formAcao")
    .addEventListener(
        "submit",
        async function (event) {

            event.preventDefault();


            const mensagem =
                document.getElementById(
                    "mensagem"
                );


            const btnCriar =
                document.getElementById(
                    "btnCriar"
                );


            btnCriar.disabled =
                true;


            try {

                const nome =
                    document.getElementById(
                        "nome"
                    ).value.trim();


                const descricao =
                    document.getElementById(
                        "descricao"
                    ).value.trim();


                const valor_numero =
                    Number(
                        document.getElementById(
                            "valor_numero"
                        ).value
                    );


                const total_numeros =
                    Number(
                        document.getElementById(
                            "total_numeros"
                        ).value
                    );


                const arquivoFoto =
                    document.getElementById(
                        "foto"
                    ).files[0];


                if (!arquivoFoto) {

                    alert(
                        "Selecione a foto do prêmio."
                    );

                    btnCriar.disabled =
                        false;

                    return;
                }


                mensagem.textContent =
                    "Enviando foto do prêmio...";


                const foto_url =
                    await enviarFoto(
                        arquivoFoto
                    );


                mensagem.textContent =
                    "Foto enviada. Criando ação...";


                const resultado =
                    await clienteSupabase

                        .from("AÇÕES")

                        .insert([{

                            nome:
                                nome,

                            descricao:
                                descricao,

                            foto_url:
                                foto_url,

                            valor_numero:
                                valor_numero,

                            total_numeros:
                                total_numeros,

                            status:
                                "ativa"

                        }])

                        .select("id")

                        .single();


                if (resultado.error) {

                    throw new Error(
                        "Erro ao criar ação: " +
                        resultado.error.message
                    );
                }


                const acaoId =
                    resultado.data.id;


                mensagem.textContent =
                    "Ação criada. Gerando números...";


                const resultadoNumeros =
                    await clienteSupabase

                        .rpc(
                            "gerar_numeros_acao",
                            {
                                p_acao_id:
                                    acaoId
                            }
                        );


                if (resultadoNumeros.error) {

                    throw new Error(
                        "Ação criada, mas houve erro ao gerar os números: " +
                        resultadoNumeros.error.message
                    );
                }


                mensagem.innerHTML =
                    "✅ Ação criada com sucesso!<br>" +
                    "🎟️ " +
                    total_numeros +
                    " números gerados.<br>" +
                    "📸 Foto enviada para o sistema.";


                document
                    .getElementById(
                        "formAcao"
                    )
                    .reset();


                document
                    .getElementById(
                        "fotoPreview"
                    )
                    .style.display =
                    "none";


                document
                    .getElementById(
                        "fotoPreview"
                    ).src = "";


                await carregarAcoes();

            }

            catch (erro) {

                console.error(
                    erro
                );

                mensagem.textContent =
                    "❌ " +
                    erro.message;

            }

            finally {

                btnCriar.disabled =
                    false;

            }

        }
    );


/* =========================
   INICIAR
========================= */

verificarSessao();

</script>

</body>
</html>
